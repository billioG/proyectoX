name: CI

# Solo verifica -- no compila ni despliega nada, así que no puede romper
# el sitio (que sigue sirviéndose tal cual desde GitHub Pages). Corre en
# cada push/PR a main y atrapa errores antes de que lleguen a producción:
# JS con errores de sintaxis, Edge Functions con errores de tipos, o una
# segunda copia de las funciones que se desincronice -- exactamente los
# tipos de bug reales que aparecieron durante el desarrollo de este proyecto.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check-client:
    name: Sintaxis JS (carpeta js/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: node --check en cada archivo .js
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' f; do
            if ! node --check "$f"; then
              echo "::error file=$f::Error de sintaxis"
              fail=1
            fi
          done < <(find js -name '*.js' -print0)
          exit $fail

  unit-tests:
    name: Pruebas unitarias (preguntas JSON, nodo escolar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # better-sqlite3: la prueba del servidor del nodo arranca school-node/server.js de verdad.
      - run: npm ci --prefix school-node
      - run: node --test "tests-unit/*.test.mjs"

  edge-functions-typecheck:
    name: Tipos de Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x
      - name: deno check en cada index.ts
        run: |
          set -e
          fail=0
          for f in supabase/functions/*/index.ts supabase/functions/_shared/*.ts; do
            [ -e "$f" ] || continue
            echo "Checking $f"
            if ! deno check "$f"; then
              echo "::error file=$f::Error de tipos"
              fail=1
            fi
          done
          exit $fail

  single-source-functions:
    name: Las Edge Functions viven solo en supabase/functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rechazar la carpeta espejo supabase-functions/
        run: |
          # Decisión de arquitectura (docs/DECISIONES.md, ADR-001): una sola fuente de verdad. La carpeta espejo
          # supabase-functions/ se eliminó porque se desincronizaba; si reaparece, esta tarea falla.
          if [ -e supabase-functions ]; then
            echo "::error::supabase-functions/ ya no existe: las funciones viven solo en supabase/functions/. Para pegarlas en el editor del panel de Supabase usa: node scripts/exportar-funciones.mjs <carpeta>"
            exit 1
          fi
          # Cada función debe tener su index.ts (las carpetas que empiezan con _ son módulos compartidos).
          fail=0
          for d in supabase/functions/*/; do
            name=$(basename "$d")
            case "$name" in _*) continue ;; esac
            if [ ! -f "$d/index.ts" ]; then
              echo "::error::Falta supabase/functions/$name/index.ts"
              fail=1
            fi
          done
          exit $fail

  tailwind-css-up-to-date:
    name: css/tailwind.css compilado al día
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Con la versión fijada por package-lock.json (npx -y bajaba dependencias más nuevas y el resultado dejaba de coincidir con el que se genera en local).
      - run: npm ci
      - name: Recompilar y comparar
        run: |
          npx --no-install tailwindcss -c tailwind.config.js -i css/tailwind.src.css -o /tmp/tailwind.css --minify
          if ! cmp -s /tmp/tailwind.css css/tailwind.css; then
            echo "::error file=css/tailwind.css::Desactualizado -- faltan clases nuevas. Correr: npm ci && npm run css"
            exit 1
          fi

  # ---------- Seguridad de la cadena de suministro ----------
  # El escaneo de secretos y la auditoría del servidor escolar BLOQUEAN (están limpios desde el 9/11/2026). La auditoría de las herramientas de
  # desarrollo solo informa: queda una alerta de Playwright (<1.55.1) cuya corrección exige subir el ejecutor de pruebas de versión mayor.
  dependency-audit:
    name: Auditoría de dependencias (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # El servidor escolar corre en las escuelas: sus dependencias de producción son lo que más importa.
      - name: Servidor escolar (producción)
        run: npm audit --omit=dev --audit-level=high --prefix school-node
      - name: Herramientas de desarrollo (solo informa)
        continue-on-error: true
        run: npm audit --audit-level=high

  secret-scan:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          set -e
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose
